# EchoSense setup hotspot captive portal.
# NetworkManager's shared-mode dnsmasq reads this directory, and the setup
# hotspot is the only shared connection on the box, so it only applies while
# the hotspot is up. Every DNS name resolves to the portal, which redirects
# phone connectivity checks to the setup page.
address=/#/10.42.0.1
# RFC 8910 captive-portal URI (Android 11+, iOS 14+).
dhcp-option=114,"http://10.42.0.1/"
