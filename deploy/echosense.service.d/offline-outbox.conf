[Service]
# Clear the connectivity-gated ExecStartPre list so the edge service can start
# while offline, then restore the existing LED permission preparation only.
ExecStartPre=
ExecStartPre=+/bin/sh -c 'chgrp gpio /sys/class/leds/ACT/brightness /sys/class/leds/ACT/trigger && chmod g+w /sys/class/leds/ACT/brightness /sys/class/leds/ACT/trigger'
