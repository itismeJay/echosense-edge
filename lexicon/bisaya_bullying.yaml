          - pangit kaayo ang panahon karon
          - pangitaa ang imong libro
          - pangita ang imong bag
          - pangita nimo ang imong bag
          - pangitaa nimo oy ang libro
          - pangita nimo oy ang libro
          - pangita nimo oy, ang imong bag
