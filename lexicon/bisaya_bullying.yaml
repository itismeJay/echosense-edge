# EchoSense Bisaya (Davao Cebuano) Grade 6 bullying lexicon.
#
# STATUS: DRAFT, needs review by a teacher at the deployment school.
# Built from common Bisaya usage, not from a study or classroom recordings.
#
# How it is used (detection/lexicon.py):
#   - Every root expands through the patterns of its `kind` into phrases.
#   - `extra` adds hand-written idioms, comparisons and mocking sounds.
#   - `end_only` phrases are hand-written too, but count only when nothing
#     follows them in the sentence ("pangita nimo oy." alerts, "pangita nimo
#     oy ang libro" = look for the book does not).
#   - `everyday` sentences use the same words innocently. They must NEVER
#     alert; tests/test_lexicon.py checks every one of them.
#   - Generated phrases match exactly (Bisaya spelling variation such as o/u
#     is still folded); they are never used for "close enough" matching.
#
# Severity (detection/severity.py decides the final level):
#   insult    aimed insults ("... ka", "... nimo")          MEDIUM
#   threat    physical threats                              HIGH
#   self_harm telling someone to die / kill themselves      HIGH
#   swear     bare swear word, not aimed                    LOW
#   context   exclusion/pressure phrases                    MEDIUM when aimed
#
# Pattern placeholders: {w} root word, {x} exclamative form (tamboka, itoma),
# {v} vocative form (yawaa, animala), {t} threat verb (patyon, sumbagon),
# {p} passive threat form (mabunalan, masumbag).
#
# Affixes (detection/lexicon.py): every pattern with "ka {w}", "pagka{w}" or
# "pinaka{w}" also makes the joined/split form ("kabogo nimo", "pagka bogo
# nimo"); hyphens are spaces when matching, so "ka-bogo" is the split form.
# Every "tika" pattern also makes "ta ka" and "taka".
#
# Extra severities (`severity:` on a root):
#   severe    slurs (bayot, lakin-on, babayeon, negro) and money/baon
#             extortion                                    HIGH unless negated
#   request   pushy "friend" requests (copy, snacks, chores) MEDIUM floor
# `skip_patterns:` drops patterns that are everyday speech for that root
# ("samok kaayo mo" = teacher: "you're so noisy, class").

version: 1
language: ceb
updated: 2026-11-25

patterns:
  adjective:              # describes the person: tambok, pangit, bogo
    - "{w} ka"
    - "{w} kaayo ka"
    - "{w} gyud ka"
    - "{w} jud ka"
    - "{w} man ka"
    - "{w} baya ka"
    - "{w} kaau ka"
    - "{w} diay ka"
    - "{w} na pud ka"
    - "{w} man kaayo ka"
    - "{w} kaayo mo"
    - "{w} kaayo kamo"
    - "ka {w} nimo"
    - "ka {w} ba nimo"
    - "ka {w} kaayo nimo"
    - "pagka{w} nimo"
    - "pagka{w} gyud nimo"
    - "pagka{w} jud nimo"
    - "ikaw ang pinaka{w}"
    - "pinaka{w} ka"
    - "{w} kag nawong"        # kag = ka ug: "pangit kag nawong"
    - "{w} kaayo kag nawong"
  exclamative:            # only for roots with a safe {x} form
    - "{x} nimo"
    - "{x} nimo oy"
    - "{x} ninyo"
    - "{x} niyo oy"
    - "{x} nimo uy"
    - "{x} ka oy"
    - "kining {x}"
  noun:                   # calls the person something: baboy, ungo, abnoy
    - "{w} ka"
    - "{w} man ka"
    - "{w} gyud ka"
    - "{w} jud ka"
    - "{w} ka oy"
    - "{w} ra ka"
    - "{w} ra mo"
    - "mura kag {w}"
    - "murag {w} ka"
    - "mura man kag {w}"
    - "mura gyud kag {w}"
    - "ikaw {w}"
    - "ikaw ang {w}"
    - "hoy {w}"               # calling someone by the insult
    - "{w} man diay ka"
    - "{w} kaayo ka"
    - "pisteng {w}"
  swear:                  # bare forms are LOW, aimed forms MEDIUM
    - "{w} ka"
    - "{w} ka gyud"
    - "{w} ka oy"
    - "{w} gyud ka"
    - "{w} jud ka"
    - "{w} man ka"
    - "{w} kaayo ka"
    - "ikaw {w}"
    - "{w} ni siya"
    - "{w} ning bataa"
    - "{w} man diay ka"
    - "pisteng {w}"
  swear_bare:             # only for roots with no everyday meaning
    - "{w}"
  vocative:               # yawaa, animala
    - "{v}"
    - "{v} ka"
    - "{v} gyud ka"
    - "{v} ning bataa"
  threat:                 # HIGH
    - "{t} tika"
    - "{t} taka"
    - "{t} ta ka"
    - "{t} ka nako"
    - "{t} gyud tika"
    - "{t} jud tika"
    - "{t} tika unya"
    - "{t} tika sa gawas"
    - "{t} tika karon"
    - "{t} tika ron"
    - "{t} ka nako unya"
    - "{t} tika ugma"
    - "{t} ka"
    - "{t} kita"
    - "{t} ko"             # "patyon ko" (I'll get killed / I'll kill it): asked for, review
    - "{t} mo"             # plural "you all"
    - "{t} jud ka"
    - "{t} gyud ka"
    - "tika {t}"            # reversed order: "tika patyon", "taka sumbagon"
    - "taka {t}"
    - "tika {t} unya"
    - "tika gyud {t}"
    - "{t} tika sa uwian"
  threat_passive:         # HIGH: "gusto ka mabunalan?" = want to get beaten?
    - "gusto ka {p}"
    - "gusto kag {p}"
    - "gusto kang {p}"
    - "basin {p} ka"
    - "{p} ka nako"
    - "{p} ka unya"

