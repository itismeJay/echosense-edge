# EchoSense Bisaya (Davao Cebuano) Grade 6 bullying lexicon.
#
# STATUS: DRAFT, needs review by a teacher at the deployment school.
# Built from common Bisaya usage, not from a study or classroom recordings.
#
# How it is used (detection/lexicon.py):
#   - Every root expands through the patterns of its `kind` into phrases.
#   - `extra` adds hand-written idioms, comparisons and mocking sounds.
#   - `end_only` phrases are hand-written too, but count only when nothing
#     follows them in the sentence ("pangita nimo oy." alerts, "pangita nimo
#     oy ang libro" = look for the book does not).
#   - `everyday` sentences use the same words innocently. They must NEVER
#     alert; tests/test_lexicon.py checks every one of them.
#   - Generated phrases match exactly (Bisaya spelling variation such as o/u
#     is still folded); they are never used for "close enough" matching.
#
# Severity (detection/severity.py decides the final level):
#   insult    aimed insults ("... ka", "... nimo")          MEDIUM
#   threat    physical threats                              HIGH
#   self_harm telling someone to die / kill themselves      HIGH
#   swear     bare swear word, not aimed                    LOW
#   context   exclusion/pressure phrases                    MEDIUM when aimed
#
# Pattern placeholders: {w} root word, {x} exclamative form (tamboka, itoma),
# {v} vocative form (yawaa, animala), {t} threat verb (patyon, sumbagon).

version: 1
language: ceb
updated: 2026-11-04

patterns:
  adjective:              # describes the person: tambok, pangit, bogo
    - "{w} ka"
    - "{w} kaayo ka"
    - "{w} gyud ka"
    - "{w} jud ka"
    - "{w} man ka"
    - "{w} baya ka"
    - "{w} kaayo mo"
    - "{w} kaayo kamo"
    - "ka {w} nimo"
    - "ka {w} ba nimo"
    - "pagka{w} nimo"
    - "pagka {w} nimo"
    - "ikaw ang pinaka{w}"
  exclamative:            # only for roots with a safe {x} form
    - "{x} nimo"
    - "{x} nimo oy"
    - "{x} ninyo"
    - "{x} niyo oy"
    - "{x} ka oy"
  noun:                   # calls the person something: baboy, ungo, abnoy
    - "{w} ka"
    - "{w} man ka"
    - "{w} gyud ka"
    - "{w} jud ka"
    - "{w} ka oy"
    - "{w} ra ka"
    - "{w} ra mo"
    - "mura kag {w}"
    - "murag {w} ka"
    - "mura man kag {w}"
    - "mura gyud kag {w}"
    - "ikaw {w}"
    - "ikaw ang {w}"
  swear:                  # bare forms are LOW, aimed forms MEDIUM
    - "{w} ka"
    - "{w} ka gyud"
    - "{w} ka oy"
    - "{w} gyud ka"
    - "{w} jud ka"
    - "{w} man ka"
    - "{w} kaayo ka"
    - "ikaw {w}"
    - "{w} ni siya"
    - "{w} ning bataa"
  swear_bare:             # only for roots with no everyday meaning
    - "{w}"
  vocative:               # yawaa, animala
    - "{v}"
    - "{v} ka"
    - "{v} gyud ka"
    - "{v} ning bataa"
  threat:                 # HIGH
    - "{t} tika"
    - "{t} taka"
    - "{t} ta ka"
    - "{t} ka nako"
    - "{t} gyud tika"
    - "{t} jud tika"
    - "{t} tika unya"
    - "{t} tika sa gawas"
    - "{t} tika karon"
    - "{t} tika ron"
    - "{t} ka nako unya"
    - "{t} tika ugma"

